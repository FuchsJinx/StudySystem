spring:
  datasource:
    # Dedicated database: tests must never depend on demo/E2E data in the dev database.
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/unirate_test}
    username: ${TEST_DATABASE_USERNAME:unirate}
    password: ${TEST_DATABASE_PASSWORD:unirate}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  flyway:
    enabled: true

unirate:
  demo-seed:
    enabled: false
  worker:
    enabled: false
  mail:
    enabled: false
  notifications:
    external-enabled: false
  uploads:
    dir: ${java.io.tmpdir}/unirate-test-uploads

logging:
  level:
    org.hibernate.SQL: warn
    org.springframework.security: warn
