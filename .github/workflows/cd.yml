name: CD

# Публикация образов в GHCR при теге v* (деплой на сервер — вручную / compose pull)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image prefix
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/${OWNER}/unirate" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME:-latest}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}-frontend:latest
