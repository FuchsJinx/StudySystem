services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unirate
      POSTGRES_USER: unirate
      POSTGRES_PASSWORD: unirate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unirate -d unirate"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/unirate
      SPRING_DATASOURCE_USERNAME: unirate
      SPRING_DATASOURCE_PASSWORD: unirate
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-unirate-jwt-secret-32+}
      UNIRATE_WORKER_ENABLED: "false"
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/unirate
      SPRING_DATASOURCE_USERNAME: unirate
      SPRING_DATASOURCE_PASSWORD: unirate
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-unirate-jwt-secret-32+}
      UNIRATE_WORKER_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: worker
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
